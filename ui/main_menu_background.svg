 <circle cx="275" cy="169" r="36" fill="#020304" stroke="#4a4d4f" stroke-width="6"/>
 <rect x="315" y="122" width="20" height="15" rx="3" fill="#b7432d"/>
</g>

<!-- rain -->
<g stroke="#b8c7d0" stroke-width="2" opacity=".24">
 <path d="M40 0L0 115M130 50L90 165M230 0L188 118M330 55L290 175M430 10L390 125M540 60L500 180M650 0L610 118M760 50L720 168M870 5L830 125M980 55L940 172M1090 0L1050 118M1200 45L1160 165M1310 5L1270 120M1420 55L1380 175M1520 0L1480 115"/>
 <path d="M80 245L40 355M190 215L150 330M300 255L260 365M410 220L370 335M520 250L480 365M630 210L590 330M740 255L700 365M850 215L810 335M960 250L920 365M1070 215L1030 330M1180 250L1140 365M1290 215L1250 335M1400 250L1360 365M1510 215L1470 330"/>
</g>

<!-- wet reflections -->
<g opacity=".18" filter="url(#blur7)">
 <rect x="500" y="690" width="300" height="8" rx="4" fill="#c18455"/>
 <rect x="610" y="725" width="420" height="5" rx="3" fill="#80909a"/>
 <rect x="710" y="770" width="300" height="4" rx="2" fill="#b6a58e"/>
 <rect x="1040" y="710" width="230" height="6" rx="3" fill="#8b6b4e"/>
</g>

<!-- foreground diary -->
<g transform="translate(35 700) rotate(-7)">
 <ellipse cx="260" cy="100" rx="280" ry="55" fill="#000" opacity=".65" filter="url(#blur7)"/>
 <rect width="500" height="150" rx="10" fill="#17100d" stroke="#634432" stroke-width="8"/>
 <rect x="22" y="18" width="456" height="112" rx="7" fill="#241813" stroke="#473026" stroke-width="4"/>
 <path d="M35 34L458 22" stroke="#79543c" stroke-width="2" opacity=".6"/>
 <text x="165" y="87" fill="#9c765a" font-size="31" font-family="Georgia,serif" letter-spacing="5">DIARIO</text>
 <path d="M55 112 Q155 55 255 108 T448 92" fill="none" stroke="#795842" stroke-width="4" opacity=".75"/>
</g>

<!-- lens moisture -->
<g fill="none" stroke="#c8d1d5" opacity=".13">
 <circle cx="1440" cy="185" r="9"/><circle cx="1375" cy="360" r="5"/><circle cx="220" cy="430" r="8"/><circle cx="310" cy="610" r="5"/>
</g>

<!-- cinematic vignette -->
<rect width="1536" height="864" fill="none" stroke="#000" stroke-width="130" opacity=".60"/>
</svg>