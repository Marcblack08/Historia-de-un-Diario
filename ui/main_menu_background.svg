 <g stroke="#67635b" stroke-width="2" opacity=".20">
  <path d="M420 330H1160"/><path d="M420 365H1160"/><path d="M420 400H1160"/><path d="M420 435H1160"/>
  <path d="M420 470H1160"/><path d="M420 505H1160"/><path d="M420 540H1160"/><path d="M420 575H1160"/>
 </g>
 <!-- porch -->
 <path d="M655 625 H925 L890 430 H690Z" fill="#211a16"/>
 <path d="M625 620 H955 V654 H625Z" fill="#100e0d"/>
 <path d="M675 425H905V450H675Z" fill="#30251e"/>
