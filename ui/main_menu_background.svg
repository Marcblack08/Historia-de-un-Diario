 <rect x="884" y="425" width="18" height="205" fill="#33261e"/>
 <!-- front door -->
 <rect x="735" y="365" width="110" height="260" rx="2" fill="#100b09" stroke="#5b3826" stroke-width="8"/>
 <rect x="748" y="383" width="84" height="92" fill="#171310" stroke="#3b281e" stroke-width="4"/>
 <rect x="748" y="487" width="84" height="122" fill="#130e0c" stroke="#3b281e" stroke-width="4"/>
 <circle cx="820" cy="500" r="5" fill="#d09a55"/>
 <!-- windows -->
 <g stroke="#110e0b" stroke-width="10" fill="url(#warm)">
   <rect x="485" y="345" width="128" height="112" rx="2"/>
   <rect x="967" y="345" width="128" height="112" rx="2"/>
   <rect x="500" y="485" width="112" height="92" rx="2"/>
   <rect x="968" y="485" width="112" height="92" rx="2"/>
   <rect x="730" y="220" width="120" height="86" rx="2"/>
 </g>
 <g stroke="#281912" stroke-width="7">
   <path d="M549 348V454M491 401H607M1031 348V454M973 401H1089"/>
   <path d="M556 488V575M504 531H608M1024 488V575M970 531H1080"/>
   <path d="M790 223V303M734 263H846"/>
 </g>
</g>

<!-- warm light bloom -->
<ellipse cx="790" cy="420" rx="240" ry="145" fill="#e08b45" opacity=".08" filter="url(#blur18)"/>

<!-- fence -->
<g fill="#101211" opacity=".95">
 <path d="M0 595H430V610H0Z"/><path d="M1090 590H1536V605H1090Z"/>
 <g>
  <path d="M65 545h14v100H65z"/><path d="M155 548h14v100h-14z"/><path d="M245 550h14v100h-14z"/><path d="M335 548h14v100h-14z"/>
  <path d="M1190 545h14v100h-14z"/><path d="M1280 540h14v105h-14z"/><path d="M1370 545h14v100h-14z"/><path d="M1460 540h14v105h-14z"/>
 </g>
</g>

<!-- car -->
