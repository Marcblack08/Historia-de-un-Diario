<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#02050b"/><stop offset=".48" stop-color="#0a1118"/><stop offset="1" stop-color="#020405"/></linearGradient>
  <radialGradient id="moonGlow"><stop stop-color="#dfe8eb" stop-opacity=".34"/><stop offset=".45" stop-color="#aab8c0" stop-opacity=".13"/><stop offset="1" stop-color="#7b8a94" stop-opacity="0"/></radialGradient>
  <radialGradient id="moon"><stop stop-color="#f2f2e8"/><stop offset=".7" stop-color="#c7cbd0"/><stop offset="1" stop-color="#7e8a91"/></radialGradient>
  <linearGradient id="houseWall" x2="0" y2="1"><stop stop-color="#4b4943"/><stop offset=".45" stop-color="#302f2c"/><stop offset="1" stop-color="#171817"/></linearGradient>
  <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#3b2418"/><stop offset="1" stop-color="#160d09"/></linearGradient>
  <linearGradient id="wet" x2="0" y2="1"><stop stop-color="#171c1f"/><stop offset="1" stop-color="#050708"/></linearGradient>
  <linearGradient id="warm" x2="0" y2="1"><stop stop-color="#d48b4d"/><stop offset="1" stop-color="#7c3c1e"/></linearGradient>
  <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="blur7"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- cinematic night -->
<rect width="1536" height="864" fill="url(#sky)"/>
<ellipse cx="1165" cy="125" rx="210" ry="170" fill="url(#moonGlow)"/>
<circle cx="1165" cy="125" r="48" fill="url(#moon)"/>

<!-- distant forest -->
<g fill="#010304" opacity=".94">
 <path d="M0 560V0h95l-12 240 80-120 42 70 68-150 42 260 90-115 35 375z"/>
 <path d="M1536 560V0h-90l10 240-72-125-48 88-60-158-55 285-80-120-35 370z"/>
</g>
<g fill="#05090b" opacity=".8">
 <path d="M0 620L90 330l80 190 75-240 105 300 90-180 120 230H0z"/>
 <path d="M1536 620l-90-290-85 205-70-250-105 315-90-180-120 200h560z"/>
</g>

<!-- ground / wet driveway -->
<path d="M0 535 Q310 500 610 540 T1110 515 T1536 500 V864 H0Z" fill="#050708"/>
<path d="M420 650 Q720 555 1035 590 Q1250 625 1536 864 H300Z" fill="url(#wet)"/>
<path d="M520 700 Q800 620 1060 650 Q1220 690 1350 864 H460Z" fill="#1b2022" opacity=".48"/>

<!-- house glow behind structure -->
<ellipse cx="790" cy="470" rx="390" ry="235" fill="#b96936" opacity=".10" filter="url(#blur18)"/>

<!-- house -->
<g filter="url(#shadow)">
 <path d="M400 280 L790 78 L1180 280 V625 H400Z" fill="url(#houseWall)" stroke="#0b0c0c" stroke-width="10"/>
 <path d="M350 282 L790 42 L1230 282 L1192 318 L790 105 L388 318Z" fill="#151616"/>
 <!-- upper roof ridges -->
 <path d="M395 278 L790 68 L1185 278" fill="none" stroke="#3a3936" stroke-width="5" opacity=".65"/>
